name: 🦞 Scrape EVE Mineral Prices

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run scraper
        run: python3 scraper.py
      - name: Commit data
        run: |
          git config user.name "🦞 小龙虾"
          git config user.email "bot@eve-tracker.local"
          git add data/
          git diff --staged --quiet || (git commit -m "🦞 数据更新 $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
